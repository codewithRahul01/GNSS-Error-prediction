name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate pipeline stages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Requirements.txt

      - name: Install dependencies
        run: pip install -r Requirements.txt

      - name: Seed test database
        run: python3 mlops/stage1_ingestion.py --mode seed

      - name: Validate schema
        run: python3 mlops/stage2_validation.py --mode validate --file Data/Raw/$(ls Data/Raw/ | grep irnss | tail -1)

      - name: Preprocess
        run: python3 mlops/stage3_preprocessing.py --mode run

      - name: Retrain (quick smoke test)
        run: python3 mlops/stage4_retrain.py --mode run

      - name: Monitor
        run: python3 mlops/stage6_monitoring.py --mode run

      - name: Print status
        run: python3 mlops/stage6_monitoring.py --mode status